<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RivalBlocks — Multiplayer block games on servers we run ourselves</title>
    <!-- The studio mark, drawn rather than filed: this project ships no image
         files, favicons included. Routes swap it for their own via useFavicon. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%2316161a%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2213%22%20height%3D%2213%22%20fill%3D%22%23ff6b1a%22%2F%3E%3Crect%20x%3D%2215%22%20y%3D%2215%22%20width%3D%2213%22%20height%3D%2213%22%20fill%3D%22%23ecebe6%22%2F%3E%3C%2Fsvg%3E" />
    <meta
      name="description"
      content="RivalBlocks builds competitive multiplayer block games and operates its own game servers in twelve regions at 128 tick."
    />
    <!-- Applies the stored or system theme before first paint so it never flashes. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rb-theme')
          var dark = stored
            ? stored === 'dark'
            : !window.matchMedia('(prefers-color-scheme: light)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          /* private mode: keep the dark default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
