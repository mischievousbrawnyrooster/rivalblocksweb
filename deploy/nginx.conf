# RivalBlocks — nginx server block for the built static site.
#
# Install to /etc/nginx/sites-available/rivalblocks and symlink into
# sites-enabled. See DEPLOY.md for the full sequence.

server {
    listen 80;
    listen [::]:80;

    # Internal network host — answer on whatever name/IP the VM has.
    server_name _;

    root /var/www/rivalblocks;
    index index.html;

    # Vite fingerprints these filenames, so the content behind a given URL
    # never changes. Cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must NOT be cached. It is the only file whose URL stays the
    # same across deploys — cache it and nobody sees the new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The game server. nginx matches the longest prefix, so this wins over
    # location / regardless of order — it sits here for readability.
    # Without the Upgrade headers the handshake fails and the board never loads.
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A quiet match must not be culled at the default 60s.
        proxy_read_timeout 1h;
    }

    # The SPA rewrite. Without this, a refresh or a direct link to /servers
    # or /games/deepshaft returns 404, because no such file exists on disk.
    # Every unmatched path serves the app, which then routes it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
}
