# RivalBlocks — nginx server block for the built static site.
#
# Install to /etc/nginx/sites-available/rivalblocks and symlink into
# sites-enabled. See DEPLOY.md for the full sequence.

server {
    listen 80;
    listen [::]:80;

    # Internal network host — answer on whatever name/IP the VM has.
    server_name _;

    root /var/www/rivalblocks;
    index index.html;

    # Vite fingerprints these filenames, so the content behind a given URL
    # never changes. Cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must NOT be cached. It is the only file whose URL stays the
    # same across deploys — cache it and nobody sees the new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The match servers. One process per game, each on its own port, so a crash
    # in one takes nothing else down with it.
    #
    # nginx matches the longest prefix, so these win over location / whatever
    # the order. None of the three below may begin with "/ws": prefix matching
    # would hand them to Blockout Royale, and the player would be quietly
    # connected to the wrong game. Vite's dev proxy behaves the same way, which
    # is why the paths are shaped like this on both sides.
    #
    # Without the Upgrade headers the handshake fails and no board ever loads.
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/rivalblocks-ws.conf;
    }

    location /fracture-ws {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/rivalblocks-ws.conf;
    }

    location /blast-ws {
        proxy_pass http://127.0.0.1:8083;
        include /etc/nginx/rivalblocks-ws.conf;
    }

    # Same binary, second mode, second process.
    location /blast-dm-ws {
        proxy_pass http://127.0.0.1:8084;
        include /etc/nginx/rivalblocks-ws.conf;
    }

    # The standing leaderboard. The match servers write these four files when a
    # match finishes; nginx just hands them over. No application, no database,
    # no cache — the file on disk is the whole API, which is also why the board
    # survives every one of these processes being restarted.
    #
    # A server that has never finished a match has no file yet. That must 404
    # rather than fall through to location / and serve index.html, which the
    # page would then fail to parse as JSON.
    location /board/ {
        alias /var/lib/rivalblocks/board/;
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The SPA rewrite. Without this, a refresh or a direct link to /servers
    # or /games/deepshaft returns 404, because no such file exists on disk.
    # Every unmatched path serves the app, which then routes it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
}
