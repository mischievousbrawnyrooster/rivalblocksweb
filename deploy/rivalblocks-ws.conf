# Shared by every /…-ws location in the site config. Install to
# /etc/nginx/rivalblocks-ws.conf — the four proxy blocks include it rather than
# repeating it, so a timeout or header fix happens once instead of four times.

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;

# Each server writes a snapshot around thirty times a second, so the 60s
# default would never fire anyway — this is insurance in case broadcasting ever
# becomes conditional and a socket goes quiet.
proxy_read_timeout 1h;
